[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obilet-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for obilet.com bus & flight tickets (bus journeys, locations, prices, flight summary)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
obilet-mcp = "obilet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obilet_mcp"]
